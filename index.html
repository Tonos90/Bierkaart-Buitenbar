<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bierkaart Buitenbar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #000;
    }

    header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff;
  border-bottom: 1px solid #ddd;

  display: grid;
  grid-template-columns: 60px 1fr 60px;
  align-items: center;

  padding: 12px 16px;
}

header span {
  grid-column: 2;
  text-align: center;
  font-size: 1.4em;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#toggleAll {
  grid-column: 3;
  justify-self: end;

  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;

  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.2;
  width: 60px;
}

#toggleAll .arrow {
  font-size: 1.3em;
}

#toggleAll .text {
  font-size: 0.65em;
  text-transform: uppercase;
  font-weight: bold;
  color: #555;
  margin-top: 2px;
}

    .container {
      padding: 10px;
    }

    .style {
      background: #ffffff;
      margin-bottom: 8px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .style-header {
      padding: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #f0f0f0;
      position: relative;
    }

    .style-header::after {
      content: "▼";
      position: absolute;
      right: 14px;
    }

    .style.open .style-header::after {
      content: "▲";
    }

    .beer-list {
      display: none;
    }

    .style.open .beer-list {
      display: block;
    }

    .beer {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid #eee;
      font-size: 0.95em;
    }

    .beer-info {
      flex: 1;
      min-width: 0;
    }

    .beer-name {
      font-weight: bold;
      display: block;
      word-break: break-word;
    }

    .beer-meta {
      font-size: 0.85em;
      color: #555;
    }

    .price {
      font-weight: bold;
      white-space: nowrap;
      flex-shrink: 0;
      min-width: 70px;
      text-align: right;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .info-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      color: #1e88e5;
      font-size: 1.1em;
      text-decoration: none;
      font-weight: bold;
    }

    .info-link:hover {
      color: #1565c0;
    }
    
    .fade-out {
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.fade-in {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
  </style>
</head>

<body>

<header>
  <span>🍺 Bierkaart Buitenbar</span>
  <button id="toggleAll" aria-label="Alles open/dicht">
    <span class="arrow">⬇︎</span>
    <span class="text">Open All</span>
  </button>
</header>

<div class="container" id="bierkaart">Laden…</div>

<script>
const SHEET_URL =
 "https://docs.google.com/spreadsheets/d/e/2PACX-1vS_4JAm9NbJvWqwdyVedQeKPTQY0GzMW3RWxur8nVJAvCB6naB1_q0YuGwEhatMXwPBLbWN3UXGOFyu/pub?output=csv"

let allData = [];
let lastMode = null; // "day" of "evening"

fetch(SHEET_URL)
  .then(res => res.text())
  .then(csv => {
    allData = parseCSV(csv).filter(b => b.present);
    updateView();
    startAutoRefresh();
  })
  .catch(err => {
    document.getElementById("bierkaart").innerHTML = "Fout bij laden van bierkaart.";
    console.error(err);
  });

function getMode() {
  const hour = new Date().getHours();
  return hour < 17 ? "day" : "evening";
}

function updateView() {
  const mode = getMode();

  if (mode === lastMode) return;

  lastMode = mode;

  let data = [...allData];

  if (mode === "day") {
    data = data.filter(b => b.order >= 10 && b.order <= 19);
  }

  data.sort((a, b) => a.order - b.order);

  render(data);
}

function startAutoRefresh() {
  const now = new Date();
  const msToNextMinute = (60 - now.getSeconds()) * 1000;

  setTimeout(() => {
    updateView(); 
    setInterval(updateView, 60000);
  }, msToNextMinute);
}

function parseCSV(text) {
  const rows = [];
  let current = [];
  let value = "";
  let insideQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && insideQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      insideQuotes = !insideQuotes;
    } else if (char === ',' && !insideQuotes) {
      current.push(value);
      value = "";
    } else if (char === '\n' && !insideQuotes) {
      current.push(value);
      rows.push(current);
      current = [];
      value = "";
    } else {
      value += char;
    }
  }

  if (value) {
    current.push(value);
    rows.push(current);
  }

  rows.shift();

  return rows.map(r => ({
    order: parseInt(r[0], 10) || 0,
    style: r[1].trim(),
    naam: r[2].trim(),
    alcohol: r[3].trim(),
    prijs: r[4].trim(),
    present: r[5].trim().toUpperCase() === "TRUE",
    info: r[6] ? r[6].trim() : ""
  }));
}

function render(bieren) {
  const container = document.getElementById("bierkaart");

  container.classList.remove("fade-in");
  container.classList.add("fade-out");

  setTimeout(() => {
    container.innerHTML = "";

    const grouped = {};
    bieren.forEach(b => {
      if (!grouped[b.style]) grouped[b.style] = [];
      grouped[b.style].push(b);
    });

    Object.keys(grouped).forEach(style => {
      const block = document.createElement("div");
      block.className = "style";

      const header = document.createElement("div");
      header.className = "style-header";
      header.textContent = style;
      header.onclick = () => block.classList.toggle("open");

      const list = document.createElement("div");
      list.className = "beer-list";

      grouped[style].forEach(b => {
        const beer = document.createElement("div");
        beer.className = "beer";
        
        beer.innerHTML = `
          <div class="beer-info">
            <span class="beer-name">${b.naam}</span>
            <span class="beer-meta">${b.alcohol}</span>
          </div>
          <div class="price">
            ${b.prijs}
            ${b.info ? `<a href="${b.info}" target="_blank" class="info-link" title="Meer info">↗</a>` : ""}
          </div>
        `;
        list.appendChild(beer);
      });

      block.appendChild(header);
      block.appendChild(list);
      container.appendChild(block);
    });

    container.classList.remove("fade-out");
    container.classList.add("fade-in");

  }, 300);
}

let allesOpen = false;
document.getElementById("toggleAll").addEventListener("click", () => {
  const styles = document.querySelectorAll(".style");
  allesOpen = !allesOpen;

  styles.forEach(style => {
    style.classList.toggle("open", allesOpen);
  });

  const button = document.getElementById("toggleAll");
  button.querySelector(".arrow").textContent = allesOpen ? "⬆︎" : "⬇︎";
  button.querySelector(".text").textContent = allesOpen ? "Close All" : "Open All";
});
</script>

</body>
</html>
